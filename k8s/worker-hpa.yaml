apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ${HPA_NAME}
  namespace: ${NAMESPACE}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ${DEPLOYMENT}
  # The whole point: 0 is a legal replica count on GKE 1.37+.
  minReplicas: 0
  maxReplicas: 100
  metrics:
  # External/Object metrics only -- CPU and memory cannot be read from a
  # workload that has no Pods, so they can never scale it off zero.
  - type: External
    external:
      metric:
        name: autoscaling.gke.io|${METRIC_CR}|${METRIC_NAME}
      target:
        type: AverageValue
        averageValue: "20"
  behavior:
    # Demo tuning. The defaults (300s scale-down stabilization) are right for
    # production but make the return to zero too slow to watch.
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Pods
        value: 10
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
